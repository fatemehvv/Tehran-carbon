# =====================================================================================================================
# Tehran-carbon: the ONE configuration file of the project. The code reads every setting from here.
#
#   defaults     every setting. Paths are relative to the repository root; raw-file paths to data/raw.
#   experiments  versioned entries (<name>_v<N>). Each lists only what differs from `defaults`, or from the entry it
#                `inherits`. `sweep` expands one entry into the Cartesian product of its values (one run each).
#   hypotheses   pre-registered decision rules, evaluated on finished runs (python main.py evaluate --hypothesis H1)
#
# Rule: never edit an experiment that already has runs (main.py refuses: config drift). Add a new version instead:
#   rq1_gated_v2: {inherits: rq1_gated_v1, train: {lr: 1.0e-3}}
# =====================================================================================================================

defaults:
  seed: 0
  paths: {raw: data/raw, interim: data/interim, processed: data/processed, runs: runs}

  # L0 analysis grid: 1/120 degree cells (~0.75 x 0.93 km), north-west corner (lon0, lat0), EPSG:4326
  grid: {H: 72, W: 126, lon0: 50.85, lat0: 35.95, cells_per_degree: 120, km_per_degree: 111.32}
  years: [1402, 1403]                              # Jalali study years (1402 = 2023-03-21 .. 2024-03-19)

  # ================================================================================================= data
  data:
    core_counties: [تهران, ری, شمیرانات]         # CORE = these counties (all 22 districts lie inside)
    boundaries:
      counties_file: spatial/counties.shp
      county_name_column: CityName
      districts_file: spatial/Tehran_Districts22.geojson
      district_id_column: district_id
      district_fractions_file: rq1_frozen/grid_district_fractions.csv
      fractions_columns: {cell: cell_id, district: district_id, frac: frac_of_cell}
      metric_crs: EPSG:32639                       # UTM 39N, for areas and distances in metres
      touch_tolerance_m: 1.0                       # districts closer than this share a boundary

    # Label domain = CORE cells that the inventory gives any CO2 (mountains and desert excluded), in every year,
    # so a model cannot score by telling 'city' from 'no city'.
    label_domain:
      file: rq1_frozen/{year}/L2/L2_grid_1km_{year}.csv
      cell_column: cell_id
      columns: [road_transport, buildings_residential, buildings_commercial, industry, power_plants_CORE, power_plants_METRO]

    # Source loaders (src/tehran_carbon/data/sources). Each returns named layers in physical units.
    inputs:
      satellite:
        file: satellite/Tehran_NO2_grid_2023_2025.tif      # TROPOMI monthly NO2 + VIIRS annual, on the L0 grid (GEE)
        no2_band: "m_{gy}_{gm:02d}"                          # band of the Gregorian month of largest overlap
        viirs_band: "viirs_{gyear}"
      context:
        ghsl_file: spatial/ghsl_2020_100m.tif
        ghsl_bands: {vol_total: 1, vol_nonres: 2, pop: 3}
        industrial_file: spatial/osm_industrial.gpkg
        area_crs: EPSG:32639
        weather_file: weather/weather_daily_era5_both.csv   # ERA5 daily, with a bias-correction column
        weather_columns: {date: date, t2m: t2m_mean_C, t2m_bias: bias_delta_C, wind: wind10_ms}
      traffic:
        l2_grid_file: rq1_frozen/{year}/L2/L2_grid_1km_{year}.csv
        l1_profiles_file: rq1_frozen/{year}/L1/L1_monthly_profiles_{year}.csv
        links_file: rq1_frozen/{year}/L2/L2_road_links_{year}.csv
        cell_column: cell_id
        month_column: month
        sectors:                                             # layer: annual L2 columns x L1 monthly share column
          inv_road: {columns: [road_transport], share: gasoline_share}
        link_columns: {lon: mid_lon, lat: mid_lat, road_class: highway, length_km: len_km, volume: vol_peak, vc: vc}
        road_classes: {motorway: road_km_motorway_trunk, trunk: road_km_motorway_trunk, primary: road_km_primary,
                       secondary: road_km_secondary, tertiary: road_km_tertiary}
      energy:
        l2_grid_file: rq1_frozen/{year}/L2/L2_grid_1km_{year}.csv
        l1_profiles_file: rq1_frozen/{year}/L1/L1_monthly_profiles_{year}.csv
        cell_column: cell_id
        month_column: month
        sectors:
          inv_residential: {columns: [buildings_residential], share: residential_gas_share}
          inv_commercial: {columns: [buildings_commercial], share: commercial_gas_share}
          inv_industry: {columns: [industry], share: flat_share}
          inv_power: {columns: [power_plants_CORE, power_plants_METRO], share: flat_share}
        hdd_column: HDD18
      pollution:
        stations_file: pollution/monitoring_points.csv
        station_id_prefix: AQ                                # AQCC stations; other rows are traffic counters
        air_files: {1402: pollution/air_daily_1402.csv, 1403: pollution/air_daily_1403_1404.csv}
        columns: {station_id: id, station_name: name, lat: latitude, lon: longitude,
                  station: station, year: year, month: month, pollutant: pollutant, value: daily_mean}
        pollutants: {aq_co: CO, aq_no2: NO2, aq_nox: NOX}    # layer -> pollutant code in the air files
        min_valid_days: 15                                   # station-months with fewer valid days are dropped
        idw_power: 2.0
        idw_min_km: 0.1
      embeddings:                                            # pretrained satellite embeddings (frozen features)
        enabled: false
        file: embeddings/alphaearth_L0_{gyear}.tif           # export with gee/export_alphaearth_L0.js
        pca_dims: 16

    target: {layer: no2, log_floor: 1.0e-7, hotspot_quantile: 0.90}

    # Feature groups. `context` goes to every model when model.use_context is true.
    # The 1403 air files hold only CO, NO2 and NOX: CO is the only pollutant that is not the target species and exists
    # in both years. NO2/NOX are tested in the sensitivity experiment rq1_pollution_no2_v1.
    modalities:
      traffic:   [inv_road, road_km_motorway_trunk, road_km_primary, road_km_secondary, road_km_tertiary, vkt_peak, vc_mean]
      energy:    [inv_residential, inv_commercial, inv_industry, inv_power, hdd]
      pollution: [aq_co]
      context:   [pop, vol_total, vol_nonres, viirs, industrial_frac, t2m, wind]
    log1p: [inv_road, inv_residential, inv_commercial, inv_industry, inv_power, pop, vol_total, vol_nonres, viirs, vkt_peak]
    spatial_lags: [3, 9]          # neighbourhood means (box half-width in cells) added for every feature; [] = off
    no_lag: [hdd, t2m, wind]      # city-wide monthly values: no spatial lag

  # ================================================================================================= validation
  split:
    scheme: block_lobo            # block_lobo | block_kfold | random_kfold
    block_km: 22                  # = autocorrelation range of the target (RQ2 correlogram); "auto" recomputes it
    buffer_km: 2.0                # training cells closer than this to the test block are dropped
    n_folds: 10                   # block_kfold / random_kfold only
    transfer: true                # also train on one year and predict the other
    inner_val: false              # true = one training fold held out for early stopping. Do NOT use with block CV:
                                  # folds have 3-595 cells, so early stopping on a 3-5-cell fold stopped training
                                  # after 31-74 of 300 epochs (all v1 neural runs; superseded by the _v2 entries)
    correlogram: {threshold: 0.2, max_km: 42.0, bin_km: 2.0, pairs: 60000}

  # ================================================================================================= model
  model:
    type: neural                  # neural | baseline
    modalities: [traffic, energy, pollution]
    use_context: true
    encoder: {hidden: 32, layers: 2, dropout: 0.1}
    fusion: {type: gated}         # early | late | gated
    backbone:                     # none | sage | gcn | gat
      type: none
      layers: 3
      scales: [1, 3, 9]           # neighbour distance (cells) of each edge set
      heads: 2                    # gat only
      dropout: 0.1
      edge_direction: true        # gat only: unit direction of every edge as an edge feature
      od:                         # sage / gcn: travel-demand links between districts (HENCE-style OD edges)
        enabled: false
        file: rq1_frozen/{year}/L2prep/OD_gravity_typical_day.csv   # gravity-model OD of RQ1 (modelled, not observed)
        origin_column: origin
        destination_column: destination
        flow_column: person_trips
    init_from: null               # {run: <run_id>, modules: [fusion], freeze: false}: start from trained weights
    baseline:                     # used when type = baseline
      name: gbm                   # ols | gbm | rf | forward_operator
      lags: [1, 3, 9, 15]         # SLX neighbourhood means (box half-width in cells); [] = own cell only
      params:
        ols: {}
        gbm: {max_iter: 300, learning_rate: 0.05, max_leaf_nodes: 31, random_state: 0}
        rf: {n_estimators: 300, min_samples_leaf: 5, max_features: 0.33, n_jobs: 4, random_state: 0}
        forward_operator: {inventory_prefix: inv_, sigmas_km: [0, 1, 2, 3, 4, 6, 8, 10, 12, 15]}

  train:
    epochs: 300
    lr: 3.0e-3
    weight_decay: 1.0e-4
    seeds: [0, 1, 2]              # predictions are averaged over seeds
    early_stopping: {patience: 30}
    months_per_batch: 12          # lower it (e.g. 2) if memory is short (GAT)
    device: auto                  # auto | cpu | cuda
    threads: 4
    save_final: true              # also fit on all label cells of all years and save models/final.pt

  eval:
    primary: pr_auc
    metrics: [pr_auc, roc_auc, f1_top, spearman, r2, mae, rmse]
    bootstrap: {n: 2000, seed: 0, level: 0.95}

  # ================================================================================================= analyses of finished runs
  analysis:
    districts:                    # out-of-fold hotspot maps -> 22 districts, compared with the RQ1 v2 classes
      ds_file: rq1_frozen/{year}/L3/L3_hotspots_DS.csv
      id_column: district_id
      references: {DS: class_DS, inventory_only: class_INV_only}
      labels: [L, M, H]           # classes by equal-count ranks (terciles)
    response:                     # is the trained GNN usable for decisions (RQ3)?
      year: 1403
      inventory_prefix: inv_      # features scaled in the scenarios
      population_feature: pop     # for the population-exposure index PEX
      district_factor: 0.7        # sign test: -30 % CO2 in one district at a time
      inside_min_fraction: 0.5    # a cell belongs to a district if at least this share lies inside
      ring_km: 2.0                # distance rings for the decay of the effect
      max_km: 30.0
      total_cut: 0.10             # uniform vs targeted cut of the same total CO2
      targeted_districts: 4       # the districts with the highest baseline predicted z
      max_local_cut: 0.9          # upper bound of the cut inside the targeted districts

  # ================================================================================================= inventory L1
  # IPCC (2006) Tier 1: E = sum_f A_f x NCV_f x density_f x EF_f. Lists are triangular [central, low, high].
  inventory:
    l1:
      draws: 10000
      factors:
        ng_ncv_MJ_m3: [34.5, 33.0, 37.0]              # ASSUMPTION for Iranian pipeline gas
        ng_ef_kg_GJ: [56.1, 54.3, 58.3]
        gas_ncv_MJ_kg: [44.3, 42.5, 44.8]
        gas_density_kg_L: [0.74, 0.72, 0.76]
        gas_ef_kg_GJ: [69.3, 67.5, 73.0]
        dsl_ncv_MJ_kg: [43.0, 41.4, 43.3]
        dsl_density_kg_L: [0.84, 0.82, 0.86]
        dsl_ef_kg_GJ: [74.1, 72.6, 74.8]
        fo_ncv_MJ_kg: [40.4, 39.8, 41.7]
        fo_density_kg_L: [0.96, 0.94, 0.99]
        fo_ef_kg_GJ: [77.4, 75.5, 78.8]
        bus_litres_diesel_share: [1.0, 0.9, 1.0]      # bus litres read as diesel (3,840 of 5,387 buses are diesel)
        heavy_diesel_other_kt: [790.0, 474.0, 1106.0] # Shahbazi et al. 2022 (2017): trucks + private bus + minibus, +-40 %
        liquid_fuels_scale: [1.0, 0.6, 1.2]
        kerosene_kg_CO2_per_L: 2.5194                  # 0.80 kg/L x 43.8 MJ/kg x 71.9 kg/GJ
        lpg_t_CO2_per_t: 2.985                         # 47.3 MJ/kg x 63.1 kg/GJ
      years:
        1403:
          gasoline_province_ML_day: [21.0, 20.0, 22.3] # NIOPDC statements 20-22 ML/day
          gasoline_core_share: [0.73, 0.71, 0.75]
          national_power: {gas_Mm3: 73533.0, fo_ML: 8983.0, gasoil_ML: 12642.0, net_GWh: 384701.0}
          weather_file: weather/weather_daily_era5_1403.csv
        1402:
          gasoline_province_ML_day: [19.54, 18.61, 21.40]  # 1403 x national ratio 115.4/124; upper 22.3 x 119/124
          gasoline_core_share: [0.734, 0.714, 0.754]
          national_power: {gas_Mm3: 76814.0, fo_ML: 6632.0, gasoil_ML: 9896.0, net_GWh: 375371.5}  # gross 1402 x net/gross 1403
          weather_file: weather/weather_daily_era5_1402.csv
      files:
        county_gas: energy/county_gas_annual.csv
        electricity: energy/electricity_province_annual.csv
        bus_fuel: energy/bus_fuel_annual.csv
        fuel_sales_annual: energy/fuel_sales_annual_historical.csv
        fuel_sales_monthly: energy/fuel_sales_monthly_historical.csv
      columns:
        county_gas: {year: year_sh, county: county_name, residential: household_million_m3,
                     commercial: commercial_public_million_m3, industry: industry_million_m3,
                     cng: transport_million_m3, power: power_plants_million_m3}
        bus_fuel: {year: year_sh, fleet: fleet, value: value_liters}
        electricity: {year: year_sh, sector: sector, value: value_GWh}
        fuel_sales: {year: year_sh, area: distribution_area, carrier: carrier, value: value_thousand_liters, month: month_name}
        weather: {date: date_local, temperature: temperature_mean_C}
      core_counties_gas: [تهران, ری, شمیرانات]
      power_counties: {تهران: CORE, ری: CORE, پاکدشت: METRO, رباطکریم: METRO}
      bus_fleets: [bus, minibus]
      electricity_sectors: {household: residential, public: public, industry: industrial, agriculture: agriculture,
                            other_and_streetlighting: lighting_and_other}
      niopdc_core_areas: [ناحيه مركز, ناحيه شمال, ناحيه جنوب, ناحيه شرق, ناحيه غرب, شهر ري]
      niopdc_month_names: [فروردين, ارديبهشت, خرداد, تير, مرداد, شهريور, مهر, آبان, آذر, دي, بهمن, اسفند]
      carriers: {gasoline: gasoline, diesel: diesel, fuel_oil: fuel_oil, kerosene: kerosene}
      liquid_fuels: {hist_years: [1395, 1398], diesel_national_scale: 1.1455, lpg_kt: 150.11}  # 38140/33296.3; 232.5 x 0.73 x 3362.4/3801.8
      monthly: {hdd_base_C: 18.0, residential_base_share: 0.25, commercial_base_share: 0.40}
      shahbazi_2022_Mt: {road_transport: 13.384, buildings: 18.339, industry: 8.077, power_plants: 6.919, total: 47.071}
      check_against: rq1_frozen/{year}/L1/L1_summary_{year}.csv  # frozen RQ1 v2 totals (regression check)

# =====================================================================================================================
experiments:

  # ---------------------------------------------------------------- RQ1: which fusion architecture, which domains
  rq1_early_v1:
    rq: RQ1
    description: early fusion (concatenate all domains), MLP
    model: {fusion: {type: early}}
  rq1_late_v1:
    rq: RQ1
    description: late (decision-level) fusion, learned weight per domain
    model: {fusion: {type: late}}
  rq1_gated_v1:
    rq: RQ1
    description: gated fusion (attention over domains) - pre-registered primary RQ1 model
  rq1_ablation_v1:
    rq: RQ1
    description: all 7 domain subsets x 3 fusion types (context always included)
    split: {inner_val: true}      # as run: early-stopping bug -> undertrained, invalid; see rq1_ablation_v2
    sweep:
      model.modalities: [[traffic], [energy], [pollution], [traffic, energy], [traffic, pollution], [energy, pollution],
                         [traffic, energy, pollution]]
      model.fusion.type: [early, late, gated]
  rq1_context_only_v1:
    rq: RQ1
    description: no domain data, context only (lower reference)
    model: {modalities: [], fusion: {type: early}}
    split: {inner_val: true}      # as run (invalid, see _v2)
  rq1_pollution_no2_v1:
    rq: RQ1
    description: sensitivity - station NO2 and NOX in the pollution domain (same species as the target)
    inherits: rq1_gated_v1
    data: {modalities: {pollution: [aq_co, aq_no2, aq_nox]}}
    split: {inner_val: true}      # as run (invalid, see _v2)
  rq1_gated_emb_v1:
    rq: RQ1
    description: gated fusion + pretrained AlphaEarth embeddings in the context group
    inherits: rq1_gated_v1
    data: {inputs: {embeddings: {enabled: true}}}
  rq1_base_forward_v1:
    rq: RQ1
    description: physical baseline - Gaussian-smoothed inventory (the RQ1 v2 product) mapped to z
    model: {type: baseline, baseline: {name: forward_operator}}
    split: {inner_val: true}      # as run (no effect on baselines; kept so the config matches the run)
  rq1_base_gbm_v1:
    rq: RQ1
    description: gradient boosting on the same features
    model: {type: baseline, baseline: {name: gbm, lags: []}}
    split: {inner_val: true}      # as run (no effect on baselines)

  # ---------------------------------------------------------------- RQ2: does a learned graph help?
  # The v1 neural entries below ran with the early-stopping bug (invalid); the valid runs are the _v2 entries.
  rq2_mlp_v1:
    rq: RQ2
    description: control - the same network without a graph
    model: {fusion: {type: gated}, backbone: {type: none}}
    data: {spatial_lags: []}
    split: {inner_val: true}      # as run (invalid, see _v2); inherited by all rq2 neural v1 entries
  rq2_sage_v1:
    rq: RQ2
    description: multi-scale GraphSAGE (pre-registered primary GNN)
    inherits: rq2_mlp_v1
    model: {backbone: {type: sage}}
  rq2_gcn_v1:
    rq: RQ2
    inherits: rq2_sage_v1
    model: {backbone: {type: gcn}}
  rq2_gat_v1:
    rq: RQ2
    description: multi-scale GATv2 (attention over edges; scale and direction as edge features), 1 seed (cost)
    inherits: rq2_sage_v1
    model: {backbone: {type: gat}}
    train: {months_per_batch: 2, seeds: [0]}
  rq2_sage_od_v1:
    rq: RQ2
    description: primary GNN + OD (travel-demand) links between districts, as in HENCE
    inherits: rq2_sage_v1
    model: {backbone: {od: {enabled: true}}}
  rq2_sage_single_scale_v1:
    rq: RQ2
    description: receptive-field check - 3 layers, only the adjacent cells (scale 1)
    inherits: rq2_sage_v1
    model: {backbone: {scales: [1]}}
    split: {transfer: false}
    train: {save_final: false}
  rq2_receptive_field_v1:
    rq: RQ2
    description: 1, 2 and 4 layers (0 layers = rq2_mlp_v1, 3 layers = rq2_sage_v1)
    inherits: rq2_sage_v1
    split: {transfer: false}
    train: {save_final: false}
    sweep:
      model.backbone.layers: [1, 2, 4]
  # design optimism: the same models under naive random CV (compare with the 22 km blocks)
  rq2_mlp_random_v1:
    rq: RQ2
    inherits: rq2_mlp_v1
    split: {scheme: random_kfold, transfer: false}
    train: {save_final: false}
  rq2_sage_random_v1:
    rq: RQ2
    inherits: rq2_sage_v1
    split: {scheme: random_kfold, transfer: false}
    train: {save_final: false}
  rq2_base_slx_gbm_random_v1:
    rq: RQ2
    inherits: rq2_base_slx_gbm_v1
    split: {scheme: random_kfold, transfer: false}
  rq2_base_ols_v1:
    rq: RQ2
    model: {type: baseline, baseline: {name: ols, lags: []}}
    data: {spatial_lags: []}
    split: {inner_val: true}      # as run (no effect on baselines); inherited by all rq2_base_* entries
  rq2_base_slx_ols_v1:
    inherits: rq2_base_ols_v1
    model: {baseline: {name: ols, lags: [1, 3, 9, 15]}}
  rq2_base_gbm_v1:
    inherits: rq2_base_ols_v1
    model: {baseline: {name: gbm, lags: []}}
  rq2_base_slx_gbm_v1:
    inherits: rq2_base_ols_v1
    model: {baseline: {name: gbm, lags: [1, 3, 9, 15]}}
  rq2_base_slx_rf_v1:
    inherits: rq2_base_ols_v1
    model: {baseline: {name: rf, lags: [1, 3, 9, 15]}}
  rq2_base_forward_v1:
    inherits: rq2_base_ols_v1
    model: {baseline: {name: forward_operator}}

  # ---------------------------------------------------------------- v2: neural re-runs with fixed 300 epochs
  # v1 used early stopping on one inner fold; with block CV that fold had 3-595 cells (3 for the final model), so
  # training stopped after 31-74 epochs. v2 = identical models and data, trained for the fixed train.epochs (as the
  # earlier RQ2 pre-registration). Deviation documented in docs/preregistration_rq1.md and _rq2.md.
  rq1_ablation_v2:
    rq: RQ1
    description: all 7 domain subsets x 3 fusion types, fixed epochs
    inherits: rq1_ablation_v1
    split: {inner_val: false}
    sweep:
      model.modalities: [[traffic], [energy], [pollution], [traffic, energy], [traffic, pollution], [energy, pollution],
                         [traffic, energy, pollution]]
      model.fusion.type: [early, late, gated]
  rq1_context_only_v2: {rq: RQ1, inherits: rq1_context_only_v1, split: {inner_val: false}}
  rq1_pollution_no2_v2: {rq: RQ1, inherits: rq1_pollution_no2_v1, split: {inner_val: false}}
  rq2_mlp_v2: {rq: RQ2, inherits: rq2_mlp_v1, split: {inner_val: false}}
  rq2_sage_v2: {rq: RQ2, inherits: rq2_sage_v1, split: {inner_val: false}}
  rq2_gcn_v2: {rq: RQ2, inherits: rq2_gcn_v1, split: {inner_val: false}}
  rq2_gat_v2: {rq: RQ2, inherits: rq2_gat_v1, split: {inner_val: false}}
  rq2_sage_od_v2: {rq: RQ2, inherits: rq2_sage_od_v1, split: {inner_val: false}}
  rq2_sage_single_scale_v2: {rq: RQ2, inherits: rq2_sage_single_scale_v1, split: {inner_val: false}}
  rq2_receptive_field_v2:
    rq: RQ2
    description: 1, 2 and 4 layers (0 layers = rq2_mlp_v2, 3 layers = rq2_sage_v2), fixed epochs
    inherits: rq2_receptive_field_v1
    split: {inner_val: false}
    sweep:
      model.backbone.layers: [1, 2, 4]
  rq2_mlp_random_v2: {rq: RQ2, inherits: rq2_mlp_random_v1, split: {inner_val: false}}
  rq2_sage_random_v2: {rq: RQ2, inherits: rq2_sage_random_v1, split: {inner_val: false}}

  # ---------------------------------------------------------------- RQ2b: DAILY NO2 + wind at the overpass
  # Pre-registered in docs/preregistration_rq2b_daily.md before any daily model is trained. Data: run
  # gee/GEE_daily_NO2_wind_L0.js and put the files in data/raw/satellite/daily/ and data/raw/weather/.
  rq2d_mlp_v1:
    rq: RQ2b
    description: daily control - same network (early fusion) without a graph
    data:
      temporal: daily
      spatial_lags: []
      inputs:
        satellite_daily: {file: "satellite/daily/Tehran_NO2_daily_{year}.tif", nodata: -9999, layer: no2_daily}
        weather_daily:
          wind_file: weather/Tehran_wind10UTC_{year}.csv          # ERA5-Land at 10 UTC (overpass), city-box mean
          wind_columns: {date: date, u: u_component_of_wind_10m, v: v_component_of_wind_10m}
          era5_file: weather/weather_daily_era5_both.csv
          era5_columns: {date: date, t2m: t2m_mean_C, t2m_bias: bias_delta_C}
          hdd_base_C: 18.0
          weekend_weekdays: [4]                                    # Friday (Monday = 0)
          nowruz_days: 13                                          # Nowruz holidays: first days of Farvardin
        pollution_daily:
          stations_file: pollution/monitoring_points.csv
          station_id_prefix: AQ
          air_files: {1402: pollution/air_daily_1402.csv, 1403: pollution/air_daily_1403_1404.csv}
          columns: {station_id: id, station_name: name, lat: latitude, lon: longitude, station: station, year: year,
                    month: month, day: day, pollutant: pollutant, value: daily_mean, valid_hours: valid_hours}
          pollutants: {aq_co_d: CO}
          min_valid_hours: 18
          idw_power: 2.0
          idw_min_km: 0.1
      target: {layer: no2_daily, log_floor: 1.0e-6, min_valid_fraction: 0.5}   # days with < 50 % clear cells dropped
      modalities:
        traffic: [inv_road, road_km_motorway_trunk, road_km_primary, road_km_secondary, road_km_tertiary, vkt_peak, vc_mean]
        energy: [inv_residential, inv_commercial, inv_industry, inv_power, hdd_d]
        pollution: [aq_co_d]
        context: [pop, vol_total, vol_nonres, viirs, industrial_frac, t2m_d, wind_d, wind_u, wind_v, weekend, nowruz]
      no_lag: [hdd_d, t2m_d, wind_d, wind_u, wind_v, weekend, nowruz]
    model: {fusion: {type: early}, backbone: {type: none}}
    split: {inner_val: false}
    train: {epochs: 30, seeds: [0], months_per_batch: 8}       # 8 days per batch; ~46 batches per year and epoch
    eval: {bootstrap: {n: 500}}
  rq2d_sage_v1:
    rq: RQ2b
    description: daily multi-scale GraphSAGE (isotropic neighbourhood)
    inherits: rq2d_mlp_v1
    model: {backbone: {type: sage}}
  rq2d_gat_v1:
    rq: RQ2b
    description: daily GATv2, edge features scale + direction, no wind
    inherits: rq2d_mlp_v1
    model: {backbone: {type: gat}}
  rq2d_gat_wind_v1:
    rq: RQ2b
    description: daily wind-aware GATv2 (edge feature = wind carried from the neighbour) - pre-registered primary
    inherits: rq2d_gat_v1
    model: {backbone: {wind_edges: true, wind_features: [wind_u, wind_v]}}
  rq2d_base_ols_v1:
    rq: RQ2b
    inherits: rq2d_mlp_v1
    model: {type: baseline, baseline: {name: ols, lags: []}}
  rq2d_base_slx_ols_v1:
    inherits: rq2d_base_ols_v1
    model: {baseline: {name: ols, lags: [1, 3, 9, 15]}}
  rq2d_base_gbm_v1:
    inherits: rq2d_base_ols_v1
    model: {baseline: {name: gbm, lags: []}}
  rq2d_base_slx_gbm_v1:
    inherits: rq2d_base_ols_v1
    model: {baseline: {name: gbm, lags: [1, 3, 9, 15]}}
  rq2d_base_forward_v1:
    inherits: rq2d_base_ols_v1
    model: {baseline: {name: forward_operator}}

  # ---------------------------------------------------------------- rehearsal of the confirmatory design (1402 / 1403 only)
  # Development data only: train on the training blocks of one year, predict the held-out blocks of the other year
  # (split.test_year), i.e. the design of the confirmatory 1404 test with the years we already have. These runs choose
  # the candidates of docs/preregistration_confirmatory_1404.md; they are not hypothesis tests.
  dev_sage_v1:
    rq: RQ2
    description: rehearsal - SAGE (3 domains, gated), 3 and 4 layers
    inherits: rq2_sage_v2
    split: {transfer: false}
    train: {save_final: false}
    sweep: {split.test_year: [1402, 1403], model.backbone.layers: [3, 4]}
  dev_sage_deep_v1:
    rq: RQ2
    description: rehearsal - SAGE with 5 and 6 layers (does the receptive-field trend continue?)
    inherits: dev_sage_v1
    sweep: {split.test_year: [1402, 1403], model.backbone.layers: [5, 6]}
  dev_sage4_fusion_v1:
    rq: RQ1
    description: rehearsal - SAGE 4 layers, single domains vs all three, gated
    inherits: dev_sage_v1
    model: {backbone: {layers: 4}}
    sweep: {split.test_year: [1402, 1403], model.modalities: [[traffic], [energy], [pollution]]}
  dev_rq1_fusion_v1:
    rq: RQ1
    description: rehearsal - RQ1 network (no graph), single domains and all three, 3 fusion types
    inherits: rq1_ablation_v2
    split: {transfer: false}
    train: {save_final: false}
    sweep:
      split.test_year: [1402, 1403]
      model.modalities: [[traffic], [energy], [pollution], [traffic, energy, pollution]]
      model.fusion.type: [early, late, gated]
  dev_base_ols_v1: {rq: RQ2, inherits: rq2_base_ols_v1, split: {transfer: false}, sweep: {split.test_year: [1402, 1403]}}
  dev_base_slx_ols_v1: {rq: RQ2, inherits: rq2_base_slx_ols_v1, split: {transfer: false}, sweep: {split.test_year: [1402, 1403]}}
  dev_base_gbm_v1: {rq: RQ2, inherits: rq2_base_gbm_v1, split: {transfer: false}, sweep: {split.test_year: [1402, 1403]}}
  dev_base_slx_gbm_v1: {rq: RQ2, inherits: rq2_base_slx_gbm_v1, split: {transfer: false}, sweep: {split.test_year: [1402, 1403]}}
  dev_base_slx_rf_v1: {rq: RQ2, inherits: rq2_base_slx_rf_v1, split: {transfer: false}, sweep: {split.test_year: [1402, 1403]}}
  dev_base_forward_v1: {rq: RQ2, inherits: rq2_base_forward_v1, split: {transfer: false}, sweep: {split.test_year: [1402, 1403]}}

  # ---------------------------------------------------------------- confirmatory test on the held-out year 1404
  # docs/preregistration_confirmatory_1404.md (written before any 1404 result). For every fold: train on the training
  # blocks of 1402 + 1403, predict the held-out block of 1404. The 1404 inventory and traffic are not available: the
  # 1403 files stand in (year_proxy). 1404 NO2: gee/GEE_grid_NO2_weather_1404.js; 1404 weather harmonised with
  # gee/harmonise_weather_1404.py.
  c1404_sage5_v1:
    rq: RQ2
    description: confirmatory - SAGE 5 layers, 3 domains gated (H2c candidate)
    inherits: rq2_sage_v2
    years: [1402, 1403, 1404]
    data: &data1404
      label_domain: {year_proxy: {1404: 1403}}
      inputs:
        satellite: {file: {1402: satellite/Tehran_NO2_grid_2023_2025.tif, 1403: satellite/Tehran_NO2_grid_2023_2025.tif,
                           1404: satellite/Tehran_NO2_grid_1404.tif}}
        context: {weather_file: weather/weather_daily_era5_1402_1404.csv}
        traffic: {year_proxy: {1404: 1403}}
        energy: {year_proxy: {1404: 1403}}
        pollution: {air_files: {1404: pollution/air_daily_1403_1404.csv}}
    split: &split1404 {test_year: 1404, transfer: false}
    train: {save_final: false}
    model: {backbone: {layers: 5}}
  c1404_sage4_v1:
    rq: RQ1
    description: confirmatory - SAGE 4 layers, 3 domains gated (H1c candidate)
    inherits: c1404_sage5_v1
    model: {backbone: {layers: 4}}
  c1404_sage4_single_v1:
    rq: RQ1
    description: confirmatory - SAGE 4 layers, one domain (H1c reference = energy; the others descriptive)
    inherits: c1404_sage4_v1
    sweep: {model.modalities: [[energy], [traffic], [pollution]]}
  c1404_base_slx_rf_v1: {rq: RQ2, inherits: rq2_base_slx_rf_v1, years: [1402, 1403, 1404], data: *data1404, split: *split1404}
  c1404_base_slx_gbm_v1: {rq: RQ2, inherits: rq2_base_slx_gbm_v1, years: [1402, 1403, 1404], data: *data1404, split: *split1404}
  c1404_base_slx_ols_v1: {rq: RQ2, inherits: rq2_base_slx_ols_v1, years: [1402, 1403, 1404], data: *data1404, split: *split1404}
  c1404_base_gbm_v1: {rq: RQ2, inherits: rq2_base_gbm_v1, years: [1402, 1403, 1404], data: *data1404, split: *split1404}
  c1404_base_ols_v1: {rq: RQ2, inherits: rq2_base_ols_v1, years: [1402, 1403, 1404], data: *data1404, split: *split1404}
  c1404_base_forward_v1: {rq: RQ2, inherits: rq2_base_forward_v1, years: [1402, 1403, 1404], data: *data1404, split: *split1404}

  # ---------------------------------------------------------------- inventory
  inv_l1_v1:
    rq: RQ1
    kind: inventory
    description: L1 sector totals (IPCC Tier 1 + Monte Carlo) for all study years
    split: {inner_val: true}      # as run (no effect on the inventory)

  # ---------------------------------------------------------------- RQ3: adaptive interventions (reinforcement learning)
  # Pre-registered in docs/preregistration_rq3.md before any agent is trained. The RQ3 settings live in this entry, not
  # in `defaults`, so the config hashes of the RQ1 / RQ2 experiments do not change.
  rq3_policy_v1:
    rq: RQ3
    kind: rl
    description: PPO vs tuned static policies in the macroscopic district simulator (H3, H4)
    rl:
      response_experiment: rq2_sage_v2           # frozen RQ2 model (latest run, models/final.pt) for the exposure term
      exposure: {road_feature: inv_road, activity_features: [vkt_peak, vc_mean], population_feature: pop}
      od:                                        # gravity OD of RQ1 (typical day, 22 x 22 districts)
        file: rq1_frozen/{year}/L2prep/OD_gravity_typical_day.csv
        origin: origin
        destination: destination
        distance: dist_km
        restricted: [veh_trips_private_car, veh_trips_taxi_app]   # vehicle trips a restriction applies to
      profile: {file: "rq1_frozen/{year}/L1/L1_monthly_profiles_{year}.csv", month: month, share: gasoline_share, hdd: HDD18}
      l1_lines:                                  # car and bus CO2 / energy of the L1 inventory
        file: "rq1_frozen/{year}/L1/L1_sector_lines_{year}.csv"
        sector_column: sector
        sector: road_transport
        subsector_column: subsector
        activity_column: activity
        co2_column: tCO2_central
        activity_scale: 1.0e+6                   # activity is in million litres / million m3
        car: [gasoline, CNG]                     # road CO2 of the restricted modes (cars, ride-hailing, motorcycles)
        bus: diesel_municipal_bus
        energy_factors:                          # MJ per unit = product of these inventory.l1.factors (central values)
          gasoline: [gas_density_kg_L, gas_ncv_MJ_kg]
          CNG: [ng_ncv_MJ_m3]
          diesel_municipal_bus: [dsl_density_kg_L, dsl_ncv_MJ_kg]
      road_grid: {file: "rq1_frozen/{year}/L2/L2_grid_1km_{year}.csv", cell: cell_id, column: road_transport}
      links: {file: "rq1_frozen/{year}/L2/L2_road_links_{year}.csv", district: district_id, free_speed: vff,
              volume: vol_peak, length: len_km}           # free-flow speed of each district (VKT-weighted)
      district_speeds: {file: "rq1_frozen/{year}/L2/L2_traffic_speed_check.csv", speed: reported_peak_kmh}
      city: {file: traffic/city_transport_by_year.csv, year: year_sh, trips_M: total_intracity_person_trips_M,
             speed: network_speed_kmh, bus_share: share_bus}
      district_trips: {file: traffic/district_trips_by_year.csv, district: district_id, year: year_sh,
                       attraction: attraction_resident_trips}
      occupancy: 1.4                             # ASSUMPTION persons per car trip
      transit_speed_kmh: 15.0                    # ASSUMPTION door-to-door bus / metro speed (walk + wait + ride)
      levers: {restriction_max: 0.3, bus_boost_max: 1.0}
      bus_budget: 0.25                           # extra bus service per year, share of the annual base service
      behaviour:                                 # ASSUMPTION triangular [central, low, high], drawn per episode
        shift: [0.5, 0.3, 0.7]                   # share of removed car trips that switch to bus / metro
        shift_boost: [0.2, 0.1, 0.3]             # extra shift share at bus_boost_max
        elasticity: [0.4, 0.2, 0.6]              # ridership elasticity to bus service (Litman 2004: 0.2-0.7)
        from_car: [0.3, 0.15, 0.45]              # share of new riders who drove before (Litman 2004)
        delay_elasticity: [1.7, 1.2, 2.5]        # delay vs car volume: London charge -18 % traffic / -30 % delay
                                                 # (TfL 2004), Stockholm -20 % / -30..-50 % (Eliasson 2009)
      demand_noise_sd: 0.05                      # monthly lognormal noise of car demand
      reward: {lambda_mobility: 1.0, mu_energy: 1.0, kappa_exposure: 1.0}   # pre-registered main weights
      agent:
        type: ppo
        timesteps: 150000
        seeds: [0, 1, 2]
        device: cpu                              # the policy network is tiny; the frozen GNN uses its own device
        params: {n_steps: 1200, batch_size: 120, learning_rate: 3.0e-4, gamma: 0.99, gae_lambda: 0.95, ent_coef: 0.0}
      static:                                    # grids of the static policies (tuned on the training year)
        uniform: {restriction: [0.1, 0.2, 0.3], bus_boost: [0.0, 0.5, 1.0]}
        winter: {months: [8, 9, 10, 11], restriction: [0.1, 0.2, 0.3], bus_boost: [0.0, 0.5, 1.0]}
        hotspot: {districts: [4, 8], restriction: [0.1, 0.2, 0.3], bus_boost: [0.0, 0.5, 1.0]}
      evaluation: {episodes: 100, seed: 1000, tune_episodes: 16, tune_seed: 50000}
      smoke:                                     # --smoke: installation check only
        agent: {timesteps: 2400}
        evaluation: {episodes: 2, tune_episodes: 1}
  rq3_daily_v1:
    rq: RQ3
    kind: rl
    description: weather-adaptive daily restriction under an annual budget (H3d; docs/preregistration_rq3_daily.md)
    inherits: rq3_policy_v1
    rl:
      temporal: daily
      response_experiment: rq2d_gat_wind_v1      # frozen daily GNN (wind on the edges) for the exposure term
      daily:
        weather_features: [wind_d, wind_u, wind_v, t2m_d]   # the day's weather the agent sees (city-wide)
        severity: {source: satellite_daily, layer: no2_daily}   # the day's observed city NO2 weighs the exposure term
      restriction_budget_days: 30                # full restriction everywhere on 30 days a year (emergency-plan scale)
      bus_budget: 0.0                            # bus service cannot change from day to day: lever off
      agent:
        timesteps: 146000                        # 400 episodes of 365 days
        params: {n_steps: 3650, batch_size: 365, learning_rate: 3.0e-4, gamma: 0.99, gae_lambda: 0.95, ent_coef: 0.0}
      static:                                    # the budget lasts the year at r = 0.025 everywhere
        uniform: {restriction: [0.025, 0.05, 0.1], bus_boost: [0.0]}
        winter: {months: [8, 9, 10, 11], restriction: [0.05, 0.075, 0.1], bus_boost: [0.0]}
        hotspot: {districts: [4, 8], restriction: [0.1, 0.2, 0.3], bus_boost: [0.0]}
        calm: {feature: wind_d, below: [-1.0, -0.5, 0.0], restriction: [0.1, 0.2, 0.3], bus_boost: [0.0]}
      evaluation: {episodes: 30, seed: 1000, tune_episodes: 8, tune_seed: 50000}
      smoke:
        agent: {timesteps: 3650}
        evaluation: {episodes: 1, tune_episodes: 1}
  rq3_lambda_v1:
    rq: RQ3
    description: secondary - trade-off curve over the travel-time weight (1 agent seed)
    inherits: rq3_policy_v1
    rl: {agent: {seeds: [0]}}
    sweep:
      rl.reward.lambda_mobility: [0.25, 0.5, 2.0, 4.0]

# =====================================================================================================================
# Pre-registered decision rules (fixed before any model is trained; docs/preregistration_rq1.md).
# Selector = experiment + optional `where` on the resolved config (a value, or {in: [...]}).
# The reference is the best of `references` by the primary metric, chosen after the results (conservative).
hypotheses:
  H1:
    rq: RQ1
    metric: pr_auc
    candidate: {experiment: rq1_ablation_v2, where: {model.modalities: [traffic, energy, pollution], model.fusion.type: gated}}
    references:
      - {experiment: rq1_ablation_v2, where: {model.modalities: {in: [[traffic], [energy], [pollution]]}}}
  H2:
    rq: RQ2
    metric: pr_auc
    candidate: {experiment: rq2_sage_v2}
    references:
      - {experiment: rq2_base_ols_v1}
      - {experiment: rq2_base_slx_ols_v1}
      - {experiment: rq2_base_gbm_v1}
      - {experiment: rq2_base_slx_gbm_v1}
      - {experiment: rq2_base_slx_rf_v1}
      - {experiment: rq2_base_forward_v1}
  H2b:                            # daily NO2 + wind (docs/preregistration_rq2b_daily.md)
    rq: RQ2b
    metric: pr_auc
    candidate: {experiment: rq2d_gat_wind_v1}
    references:
      - {experiment: rq2d_base_ols_v1}
      - {experiment: rq2d_base_slx_ols_v1}
      - {experiment: rq2d_base_gbm_v1}
      - {experiment: rq2d_base_slx_gbm_v1}
      - {experiment: rq2d_base_forward_v1}
  H2c:                            # confirmatory, held-out year 1404 (docs/preregistration_confirmatory_1404.md)
    rq: RQ2
    metric: pr_auc
    years: [1404]
    candidate: {experiment: c1404_sage5_v1}
    references: [{experiment: c1404_base_slx_rf_v1}]           # fixed in advance: best traditional model of the rehearsal
  H2c_robust:                     # NOT pre-registered (added after the H2c result): the same candidate against the best
    rq: RQ2                       # of ALL traditional models on 1404, chosen after the results; a robustness check only
    metric: pr_auc
    years: [1404]
    candidate: {experiment: c1404_sage5_v1}
    references:
      - {experiment: c1404_base_slx_rf_v1}
      - {experiment: c1404_base_slx_gbm_v1}
      - {experiment: c1404_base_slx_ols_v1}
      - {experiment: c1404_base_gbm_v1}
      - {experiment: c1404_base_ols_v1}
      - {experiment: c1404_base_forward_v1}
  H1c:                            # confirmatory, held-out year 1404
    rq: RQ1
    metric: pr_auc
    years: [1404]
    candidate: {experiment: c1404_sage4_v1}
    references: [{experiment: c1404_sage4_single_v1, where: {model.modalities: [energy]}}]   # best single domain of the rehearsal
  H3:                             # RL vs the best tuned static policy, transfers (docs/preregistration_rq3.md)
    rq: RQ3
    kind: policy
    experiment: rq3_policy_v1
    test: effectiveness
    bootstrap: {n: 2000, seed: 0, level: 0.95}
  H3d:                            # daily, weather-adaptive design (docs/preregistration_rq3_daily.md)
    rq: RQ3
    kind: policy
    experiment: rq3_daily_v1
    test: effectiveness
    exclude_families: [calm]      # the reactive weather rule is a secondary comparison, not a static reference
    bootstrap: {n: 2000, seed: 0, level: 0.95}
  H4:                             # CVaR of the policy screened by simulation vs a choice made without simulation
    rq: RQ3
    kind: policy
    experiment: rq3_policy_v1
    test: risk
    cvar: 0.10
    bootstrap: {n: 2000, seed: 0, level: 0.95}
