<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 360" width="1180" height="360" font-family="Arial, Helvetica, sans-serif">
  <!-- Data: energy layers, 1402, label domain (2,436 cells). One point = median over the four energy layers for one
       realisation. A, B: results/fusion_review/fusion_review_domain.csv (domain == energy); C:
       results/fusion_amend/fusion_amend_m5.csv (year == 1402). Panel a: x = 140 + 420 * share.
       Panel b: x = 700 + 525 * (rho + 0.4). -->
  <rect width="1180" height="360" fill="#ffffff"/>

  <!-- row labels -->
  <g font-size="14" fill="#0b0b0b" text-anchor="end">
    <text x="124" y="95">Real layers</text>
    <text x="124" y="145">A  IAAFT</text>
    <text x="124" y="195">B  rotate + shift</text>
    <text x="124" y="245">C  conditional</text>
  </g>

  <!-- ===== panel a: share of zero cells ===== -->
  <text x="140" y="34" font-size="16" font-weight="bold" fill="#0b0b0b">a  Share of zero cells</text>
  <g stroke="#e6e5e0" stroke-width="1">
    <line x1="140" y1="66" x2="140" y2="266"/><line x1="245" y1="66" x2="245" y2="266"/>
    <line x1="350" y1="66" x2="350" y2="266"/><line x1="455" y1="66" x2="455" y2="266"/>
    <line x1="560" y1="66" x2="560" y2="266"/>
  </g>
  <line x1="140" y1="266" x2="560" y2="266" stroke="#8a8984" stroke-width="1.2"/>
  <g font-size="12.5" fill="#52514e" text-anchor="middle">
    <text x="140" y="286">0</text><text x="245" y="286">0.25</text><text x="350" y="286">0.5</text>
    <text x="455" y="286">0.75</text><text x="560" y="286">1</text>
  </g>
  <line x1="431.1" y1="66" x2="431.1" y2="266" stroke="#0b0b0b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="431.1" cy="90" r="6.5" fill="#0b0b0b"/>
  <!-- A -->
  <g fill="#ffffff" stroke="#8a8984" stroke-width="2">
    <circle cx="544.5" cy="140" r="6"/><circle cx="501.6" cy="140" r="6"/><circle cx="504.1" cy="140" r="6"/>
    <circle cx="515.5" cy="140" r="6"/><circle cx="502.9" cy="140" r="6"/>
  </g>
  <!-- B -->
  <g fill="#8a8984" stroke="#ffffff" stroke-width="1">
    <circle cx="549.9" cy="190" r="6"/><circle cx="547.4" cy="190" r="6"/><circle cx="551.2" cy="190" r="6"/>
    <circle cx="512.1" cy="190" r="6"/><circle cx="541.5" cy="190" r="6"/>
  </g>
  <!-- C -->
  <g fill="#6250d6" stroke="#ffffff" stroke-width="1">
    <rect x="286.5" y="234" width="12" height="12"/><rect x="298.2" y="234" width="12" height="12"/>
    <rect x="292.8" y="234" width="12" height="12"/><rect x="275.5" y="234" width="12" height="12"/>
    <rect x="291.1" y="234" width="12" height="12"/>
  </g>
  <text x="350" y="314" font-size="13" text-anchor="middle" fill="#52514e">share of the evaluated cells where the layer is zero</text>

  <!-- ===== panel b: Spearman with the target ===== -->
  <text x="700" y="34" font-size="16" font-weight="bold" fill="#0b0b0b">b  Spearman correlation with the NO₂ target</text>
  <g stroke="#e6e5e0" stroke-width="1">
    <line x1="700" y1="66" x2="700" y2="266"/><line x1="805" y1="66" x2="805" y2="266"/>
    <line x1="1015" y1="66" x2="1015" y2="266"/><line x1="1120" y1="66" x2="1120" y2="266"/>
  </g>
  <line x1="910" y1="66" x2="910" y2="266" stroke="#52514e" stroke-width="1.2"/>
  <line x1="700" y1="266" x2="1120" y2="266" stroke="#8a8984" stroke-width="1.2"/>
  <g font-size="12.5" fill="#52514e" text-anchor="middle">
    <text x="700" y="286">−0.4</text><text x="805" y="286">−0.2</text><text x="910" y="286">0</text>
    <text x="1015" y="286">0.2</text><text x="1120" y="286">0.4</text>
  </g>
  <line x1="1016.6" y1="66" x2="1016.6" y2="266" stroke="#0b0b0b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="1016.6" cy="90" r="6.5" fill="#0b0b0b"/>
  <g fill="#ffffff" stroke="#8a8984" stroke-width="2">
    <circle cx="891.6" cy="140" r="6"/><circle cx="914.7" cy="140" r="6"/><circle cx="911.1" cy="140" r="6"/>
    <circle cx="875.4" cy="140" r="6"/><circle cx="758.8" cy="140" r="6"/>
  </g>
  <g fill="#8a8984" stroke="#ffffff" stroke-width="1">
    <circle cx="901.1" cy="190" r="6"/><circle cx="824.4" cy="190" r="6"/><circle cx="857.5" cy="190" r="6"/>
    <circle cx="984.0" cy="190" r="6"/><circle cx="833.9" cy="190" r="6"/>
  </g>
  <g fill="#6250d6" stroke="#ffffff" stroke-width="1">
    <rect x="1002.7" y="234" width="12" height="12"/><rect x="1008.5" y="234" width="12" height="12"/>
    <rect x="995.9" y="234" width="12" height="12"/><rect x="1036.3" y="234" width="12" height="12"/>
    <rect x="1009.0" y="234" width="12" height="12"/>
  </g>
  <text x="910" y="314" font-size="13" text-anchor="middle" fill="#52514e">rank correlation between placebo layer and annual NO₂ (z)</text>

  <text x="590" y="346" font-size="12.5" text-anchor="middle" fill="#52514e">Energy layers, 1402, on the 2,436 evaluated cells. One point = one realisation (median over the four layers). Dashed line: real layers.</text>
</svg>
