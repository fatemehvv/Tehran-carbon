seed: 0
paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  runs: runs
grid:
  H: 72
  W: 126
  lon0: 50.85
  lat0: 35.95
  cells_per_degree: 120
  km_per_degree: 111.32
years:
- 1402
- 1403
data:
  core_counties:
  - تهران
  - ری
  - شمیرانات
  boundaries:
    counties_file: spatial/counties.shp
    county_name_column: CityName
    districts_file: spatial/Tehran_Districts22.geojson
    district_id_column: district_id
    district_fractions_file: rq1_frozen/grid_district_fractions.csv
    fractions_columns:
      cell: cell_id
      district: district_id
      frac: frac_of_cell
    metric_crs: EPSG:32639
    touch_tolerance_m: 1.0
  label_domain:
    file: rq1_frozen/{year}/L2/L2_grid_1km_{year}.csv
    cell_column: cell_id
    columns:
    - road_transport
    - buildings_residential
    - buildings_commercial
    - industry
    - power_plants_CORE
    - power_plants_METRO
  inputs:
    satellite:
      file: satellite/Tehran_NO2_grid_2023_2025.tif
      no2_band: m_{gy}_{gm:02d}
      viirs_band: viirs_{gyear}
    context:
      ghsl_file: spatial/ghsl_2020_100m.tif
      ghsl_bands:
        vol_total: 1
        vol_nonres: 2
        pop: 3
      industrial_file: spatial/osm_industrial.gpkg
      area_crs: EPSG:32639
      weather_file: weather/weather_daily_era5_both.csv
      weather_columns:
        date: date
        t2m: t2m_mean_C
        t2m_bias: bias_delta_C
        wind: wind10_ms
    traffic:
      l2_grid_file: rq1_frozen/{year}/L2/L2_grid_1km_{year}.csv
      l1_profiles_file: rq1_frozen/{year}/L1/L1_monthly_profiles_{year}.csv
      links_file: rq1_frozen/{year}/L2/L2_road_links_{year}.csv
      cell_column: cell_id
      month_column: month
      sectors:
        inv_road:
          columns:
          - road_transport
          share: gasoline_share
      link_columns:
        lon: mid_lon
        lat: mid_lat
        road_class: highway
        length_km: len_km
        volume: vol_peak
        vc: vc
      road_classes:
        motorway: road_km_motorway_trunk
        trunk: road_km_motorway_trunk
        primary: road_km_primary
        secondary: road_km_secondary
        tertiary: road_km_tertiary
    energy:
      l2_grid_file: rq1_frozen/{year}/L2/L2_grid_1km_{year}.csv
      l1_profiles_file: rq1_frozen/{year}/L1/L1_monthly_profiles_{year}.csv
      cell_column: cell_id
      month_column: month
      sectors:
        inv_residential:
          columns:
          - buildings_residential
          share: residential_gas_share
        inv_commercial:
          columns:
          - buildings_commercial
          share: commercial_gas_share
        inv_industry:
          columns:
          - industry
          share: flat_share
        inv_power:
          columns:
          - power_plants_CORE
          - power_plants_METRO
          share: flat_share
      hdd_column: HDD18
    pollution:
      stations_file: pollution/monitoring_points.csv
      station_id_prefix: AQ
      air_files:
        1402: pollution/air_daily_1402.csv
        1403: pollution/air_daily_1403_1404.csv
      columns:
        station_id: id
        station_name: name
        lat: latitude
        lon: longitude
        station: station
        year: year
        month: month
        pollutant: pollutant
        value: daily_mean
      pollutants:
        aq_co: CO
        aq_no2: NO2
        aq_nox: NOX
      min_valid_days: 15
      idw_power: 2.0
      idw_min_km: 0.1
    embeddings:
      enabled: false
      file: embeddings/alphaearth_L0_{gyear}.tif
      pca_dims: 16
  target:
    layer: no2
    log_floor: 1.0e-07
    hotspot_quantile: 0.9
    smooth_km: 4.0
  modalities:
    traffic:
    - inv_road
    - road_km_motorway_trunk
    - road_km_primary
    - road_km_secondary
    - road_km_tertiary
    - vkt_peak
    - vc_mean
    energy:
    - inv_residential
    - inv_commercial
    - inv_industry
    - inv_power
    - hdd
    pollution:
    - aq_co
    context:
    - pop
    - vol_total
    - vol_nonres
    - viirs
    - industrial_frac
    - t2m
    - wind
  log1p:
  - inv_road
  - inv_residential
  - inv_commercial
  - inv_industry
  - inv_power
  - pop
  - vol_total
  - vol_nonres
  - viirs
  - vkt_peak
  spatial_lags:
  - 3
  - 9
  no_lag:
  - hdd
  - t2m
  - wind
split:
  scheme: block_lobo
  block_km: 22
  buffer_km: 2.0
  n_folds: 10
  transfer: false
  inner_val: false
  correlogram:
    threshold: 0.2
    max_km: 42.0
    bin_km: 2.0
    pairs: 60000
  fold_aware_stations: true
  fold_aware_target: true
model:
  type: neural
  modalities:
  - traffic
  - energy
  - pollution
  use_context: true
  encoder:
    hidden: 32
    layers: 2
    dropout: 0.1
  fusion:
    type: gated
  backbone:
    type: none
    layers: 3
    scales:
    - 1
    - 3
    - 9
    heads: 2
    dropout: 0.1
    edge_direction: true
    od:
      enabled: false
      file: rq1_frozen/{year}/L2prep/OD_gravity_typical_day.csv
      origin_column: origin
      destination_column: destination
      flow_column: person_trips
  init_from: null
  baseline:
    name: gbm
    lags:
    - 1
    - 3
    - 9
    - 15
    params:
      ols: {}
      gbm:
        max_iter: 300
        learning_rate: 0.05
        max_leaf_nodes: 31
        random_state: 0
      rf:
        n_estimators: 300
        min_samples_leaf: 5
        max_features: 0.33
        n_jobs: 4
        random_state: 0
      forward_operator:
        inventory_prefix: inv_
        sigmas_km:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 6
        - 8
        - 10
        - 12
        - 15
train:
  epochs: 300
  lr: 0.003
  weight_decay: 0.0001
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  early_stopping:
    patience: 30
  months_per_batch: 12
  device: auto
  threads: 4
  save_final: false
  save_members: true
eval:
  primary: pr_auc
  metrics:
  - pr_auc
  - roc_auc
  - f1_top
  - spearman
  - r2
  - mae
  - rmse
  bootstrap:
    n: 2000
    seed: 0
    level: 0.95
analysis:
  districts:
    ds_file: rq1_frozen/{year}/L3/L3_hotspots_DS.csv
    id_column: district_id
    references:
      DS: class_DS
      inventory_only: class_INV_only
    labels:
    - L
    - M
    - H
  response:
    year: 1403
    inventory_prefix: inv_
    population_feature: pop
    district_factor: 0.7
    inside_min_fraction: 0.5
    ring_km: 2.0
    max_km: 30.0
    total_cut: 0.1
    targeted_districts: 4
    max_local_cut: 0.9
  paper:
    metrics:
    - pr_auc
    - spearman
    alpha: 0.025
    margin: 0.02
    thresholds:
    - 0.8
    - 0.9
    - 0.95
    superpixel: 5
    footprint_km:
    - 3.5
    - 5.5
    correlogram:
      max_km: 40.0
      bin_km: 2.0
    signflip:
      max_exact: 16
      n_random: 20000
      seed: 0
    power:
      effects:
      - 0.01
      - 0.02
      - 0.03
      - 0.05
      - 0.08
