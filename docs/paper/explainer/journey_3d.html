<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}</style></head><body><title>شعاع، نه گراف</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a working "map room". The 3D stage holds the scene of each step; the narrative panel on the reading side
   carries the argument. One journey through the city of Tehran, its data and its models, step by step. */
:root{
  --bg:#e9edf1;          /* mineral grey-blue ground */
  --panel:#fbfcfd;
  --ink:#16202b;
  --muted:#566373;
  --line:#d3dae2;
  --accent:#d2522a;      /* NO₂ plume: the colour of a TROPOMI hotspot */
  --accent-soft:#f6d9cc;
  --gnn:#2a74d6; --ols:#e8663d; --gbm:#1fae7a; --rf:#eba300; --mlp:#8a877f;
  --good:#1f9d6a; --warn:#c98a0b;
  --scene-low:#9fb3c8; --scene-mid:#d9c7a8; --scene-tile:#c3ccd6; --scene-line:#8693a3; --scene-faint:#dde3e9;
  --label-bg:rgba(251,252,253,.92); --label-ink:#16202b;
  --f-body:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --s-1:.8125rem; --s0:1rem; --s1:1.125rem; --s2:1.4rem; --s3:1.9rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --panel:#141c26; --ink:#e5ebf1; --muted:#97a4b3; --line:#253141;
  --accent:#ff7b4a; --accent-soft:#3d2219;
  --gnn:#5a9bf0; --ols:#f07a52; --gbm:#33c48f; --rf:#f2b52a; --mlp:#a29f97;
  --good:#3cc68a; --warn:#e3a52a;
  --scene-low:#3d5470; --scene-mid:#8a7a5f; --scene-tile:#2a3644; --scene-line:#5d6b7c; --scene-faint:#1c2632;
  --label-bg:rgba(20,28,38,.9); --label-ink:#e5ebf1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --panel:#141c26; --ink:#e5ebf1; --muted:#97a4b3; --line:#253141;
  --accent:#ff7b4a; --accent-soft:#3d2219;
  --gnn:#5a9bf0; --ols:#f07a52; --gbm:#33c48f; --rf:#f2b52a; --mlp:#a29f97;
  --good:#3cc68a; --warn:#e3a52a;
  --scene-low:#3d5470; --scene-mid:#8a7a5f; --scene-tile:#2a3644; --scene-line:#5d6b7c; --scene-faint:#1c2632;
  --label-bg:rgba(20,28,38,.9); --label-ink:#e5ebf1; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--s0);line-height:1.75;direction:rtl;
  display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:1rem;padding-block:.55rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.brand{font-weight:800;font-size:var(--s1);letter-spacing:-.01em;white-space:nowrap}
.brand small{font-weight:500;color:var(--muted);font-size:var(--s-1);margin-inline-start:.6rem}
.part{margin-inline-start:auto;font-size:var(--s-1);color:var(--muted);white-space:nowrap}
.part b{color:var(--accent);font-weight:700}

.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,440px) 1fr}
.panel{background:var(--panel);border-inline-end:1px solid var(--line);overflow-y:auto;min-width:0;
  padding-block:1.4rem 2rem;padding-inline:1.5rem}
.eyebrow{font-size:var(--s-1);font-weight:700;color:var(--accent);letter-spacing:.02em}
.panel h1{font-size:var(--s3);line-height:1.3;font-weight:800;margin:.2rem 0 1rem;text-wrap:balance}
.panel h3{font-size:var(--s1);margin:1.3rem 0 .4rem;font-weight:700}
.panel p{margin:.55rem 0}
.panel ul,.panel ol{margin:.4rem 0;padding-inline-start:1.2rem}
.panel li{margin:.3rem 0}
.lead{font-size:var(--s1);color:var(--ink)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.quote{border-inline-start:3px solid var(--accent);padding:.6rem .9rem;background:var(--accent-soft);margin:1rem 0;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem;margin:1rem 0}
.stat{border:1px solid var(--line);padding:.55rem .7rem}
.stat b{display:block;font-size:var(--s2);font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:var(--s-1);color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:var(--s-1);margin:.6rem 0}
.tw{overflow-x:auto}
th,td{text-align:start;padding:.35rem .4rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:700}
.chip{display:inline-block;font-size:.72rem;font-weight:700;padding:.05rem .45rem;border-radius:3px;white-space:nowrap}
.c-no{background:color-mix(in srgb,var(--ols) 22%,transparent)}
.c-part{background:color-mix(in srgb,var(--rf) 26%,transparent)}
.c-nr{background:color-mix(in srgb,var(--mlp) 25%,transparent)}
.c-yes{background:color-mix(in srgb,var(--gnn) 28%,transparent)}
.ok{color:var(--good);font-weight:700}
.wa{color:var(--warn);font-weight:700}
.checks{list-style:none;padding:0!important}
.checks li{display:grid;grid-template-columns:1.3rem 1fr;gap:.4rem;padding:.35rem 0;border-bottom:1px solid var(--line);margin:0}
.checks li>i{font-style:normal;font-weight:800}
code,.path{font-family:var(--f-mono);font-size:.8em;direction:ltr;unicode-bidi:isolate}
.en{direction:ltr;unicode-bidi:isolate}

.controls{display:flex;flex-wrap:wrap;gap:.45rem;margin:1rem 0 .3rem}
.controls:empty{display:none}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{background:transparent;border:0;padding:.3rem .7rem;cursor:pointer;font-size:var(--s-1)}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.slider{display:flex;align-items:center;gap:.6rem;width:100%;font-size:var(--s-1)}
.slider input{flex:1;accent-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .9rem;width:100%;font-size:var(--s-1)}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.legend i{width:.8rem;height:.8rem;border-radius:50%;display:inline-block}
.readout{font-weight:800;font-size:var(--s2);font-variant-numeric:tabular-nums}

.stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);background:var(--label-bg);color:var(--label-ink);
  font-size:.74rem;line-height:1.35;padding:.12rem .45rem;border:1px solid var(--line);white-space:nowrap;
  transition:opacity .35s;will-change:transform}
.lbl.big{font-size:.9rem;font-weight:700;padding:.25rem .6rem}
.lbl.plain{background:transparent;border:0;color:var(--muted);font-size:.72rem}
.lbl.tick{background:transparent;border:0;color:var(--muted);font-size:.7rem;font-variant-numeric:tabular-nums}
.lbl.hot{border-color:var(--accent);color:var(--accent);font-weight:700}
.lbl .gm{display:flex;gap:3px;align-items:flex-end;height:26px;margin-top:3px;direction:ltr}
.lbl .gm i{width:9px;display:block}
.caption{position:absolute;bottom:.6rem;inset-inline:max(12px,env(safe-area-inset-left,0px));font-size:var(--s-1);
  color:var(--muted);pointer-events:none;text-wrap:balance}
.caption b{color:var(--ink);font-weight:700}
.hint{position:absolute;top:.6rem;inset-inline-start:.8rem;font-size:.72rem;color:var(--muted);pointer-events:none}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:2rem;text-align:center;color:var(--muted)}

.bottom{display:flex;align-items:center;gap:.8rem;flex:none;background:var(--panel);border-top:1px solid var(--line);
  padding-block:.5rem calc(.5rem + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav{background:var(--ink);color:var(--panel);border:0;padding:.4rem 1rem;cursor:pointer;font-weight:700;white-space:nowrap}
.nav:disabled{opacity:.3;cursor:default}
.dots{flex:1;display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-width:0}
.dot{width:22px;height:22px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:.66rem;
  color:var(--muted);padding:0;font-variant-numeric:tabular-nums}
.dot[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:#fff}
.dot.sep{margin-inline-start:10px}

@media (max-width:860px){
  body{overflow:auto;height:auto}
  .app{display:flex;flex-direction:column-reverse}
  .stage{height:48vh;min-height:300px;flex:none}
  .panel{border:0;overflow:visible;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
  .panel{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .bottom{position:sticky;bottom:0}
  .dots{display:none}
  .part{display:none}
  .brand small{display:none}
  .panel h1{font-size:var(--s2)}
}
@media (prefers-reduced-motion:reduce){.lbl{transition:none}}
</style>

<header class="top">
  <div class="brand">شعاع، نه گراف<small>از پایان‌نامه تا مقاله · RQ1 و RQ2</small></div>

</header>

<main class="app">

</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
"use strict";
/* ---------------------------------------------------------------- helpers */
const FA = "۰۱۲۳۴۵۶۷۸۹";
const fa = (x) => String(x).replace(/[0-9]/g, (d) => FA[d]).replace(/\./g, "٫").replace(/-/g, "−");
const f3 = (v) => fa(v.toFixed(3));
const sgn = (v, d = 3) => (v > 0 ? "+" : v < 0 ? "−" : "") + fa(Math.abs(v).toFixed(d));
const ltrNums = (h) => h.replace(/([+−\-])([۰-۹][۰-۹٫]*)/g, '<bdi dir="ltr">$1$2</bdi>');
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const CELL_KM = 0.84;
const W = 126, H = 72;                       // grid columns (east-west) and rows (north-south)
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

/* ---------------------------------------------------------------- real data (from the project's result files) */
// docs/paper/results_review/reach/reach_curve.csv: [reach_km, spearman, pr_auc]
const CURVE = {
  1402: {
    "SLX-OLS": [[0,.662,.504],[.8,.728,.544],[2.5,.757,.461],[7.6,.857,.513],[12.6,.922,.763],[15.1,.916,.681],[22.7,.938,.803],[30.3,.942,.735],[37.8,.935,.804]],
    "SLX-GBM": [[0,.768,.52],[.8,.767,.612],[2.5,.78,.671],[7.6,.856,.657],[12.6,.924,.763],[15.1,.921,.766],[22.7,.938,.733],[30.3,.938,.764],[37.8,.95,.781]],
    "SLX-RF":  [[0,.759,.52],[.8,.743,.639],[2.5,.767,.678],[7.6,.866,.691],[12.6,.917,.706],[15.1,.921,.704],[22.7,.934,.696],[30.3,.939,.71],[37.8,.943,.716]],
    "GNN":     [[7.6,.902,.721],[15.1,.938,.736],[22.7,.949,.8],[30.3,.95,.802],[37.8,.946,.805]],
    "MLP":     [[0,.685,.49],[22.7,.954,.787],[37.8,.958,.775]],
  },
  1403: {
    "SLX-OLS": [[0,.668,.533],[.8,.729,.558],[2.5,.758,.473],[7.6,.868,.522],[12.6,.934,.753],[15.1,.924,.718],[22.7,.931,.737],[30.3,.929,.733],[37.8,.924,.749]],
    "SLX-GBM": [[0,.745,.521],[.8,.757,.595],[2.5,.788,.663],[7.6,.861,.689],[12.6,.912,.791],[15.1,.913,.771],[22.7,.934,.769],[30.3,.933,.75],[37.8,.936,.788]],
    "SLX-RF":  [[0,.743,.501],[.8,.737,.635],[2.5,.774,.662],[7.6,.867,.728],[12.6,.915,.798],[15.1,.916,.797],[22.7,.93,.797],[30.3,.932,.784],[37.8,.937,.792]],
    "GNN":     [[7.6,.907,.713],[15.1,.942,.791],[22.7,.947,.841],[30.3,.949,.864],[37.8,.946,.871]],
    "MLP":     [[0,.676,.449],[22.7,.955,.874],[37.8,.956,.881]],
  },
};
const FAMS = [["SLX-OLS","--ols","SLX-OLS"],["SLX-GBM","--gbm","SLX-GBM"],["SLX-RF","--rf","SLX-RF"],
              ["GNN","--gnn","GNN (۵ seed)"],["MLP","--mlp","همان شبکه بدون گراف"]];
// docs/paper/results_review/evaluate_step5: GNN minus reference, Spearman, delta and 95 % jackknife interval
const DIFF_SLX = [ // reach, [1402 d, lo, hi], [1403 d, lo, hi]
  [7.6,[.036,-.024,.096],[.040,-.021,.100]],[15.1,[.022,-.041,.085],[.018,-.035,.072]],
  [22.7,[.011,-.034,.056],[.013,-.028,.053]],[30.3,[.011,-.023,.046],[.016,-.026,.059]],
  [37.8,[-.004,-.035,.028],[.009,-.031,.050]]];
const DIFF_NOG = [[22.7,[-.005,-.017,.007],[-.008,-.016,-.001]],[37.8,[-.012,-.030,.005],[-.010,-.017,-.003]]];
// docs/tables/t12_sector_bias_sigma.csv: correlation of road and building CO2 after smoothing, 1402
const RB = [[0,.584],[1,.900],[2,.963],[3,.982],[4,.990],[6,.996],[8,.998],[10,.999],[12,.999],[15,.999]];

/* ---------------------------------------------------------------- schematic city (not the real map) */
const MASK = [], FIELD = new Float32Array(W * H);
(function buildCity() {
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const x = (c - 63) / 46, y = (r - 42) / 19;
    const wob = 0.13 * Math.sin(c * 0.19 + 1) + 0.1 * Math.cos(r * 0.31 + c * 0.07);
    const g = (cx, cy, s, a) => a * Math.exp(-((c - cx) ** 2 + (r - cy) ** 2) / (2 * s * s));
    FIELD[r * W + c] = g(63, 44, 15, 1) + g(48, 47, 10, .55) + g(80, 45, 11, .5) + g(62, 54, 8, .45) + (r - 20) / 60 * .45;
    if (x * x + y * y < 1 + wob && r > 18) MASK.push([c, r]);
  }
})();
const vals = MASK.map(([c, r]) => FIELD[r * W + c]);
const vmin = Math.min(...vals), vmax = Math.max(...vals);
const HOT = [...vals].sort((a, b) => b - a)[Math.floor(vals.length * 0.1)];

/* ---------------------------------------------------------------- three.js scene */
const canvas = document.getElementById("gl"), stage = document.getElementById("stage");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); }
catch (e) { renderer = null; }
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 4000);
let controls = null;
if (renderer) {
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.dampingFactor = 0.08; controls.maxPolarAngle = Math.PI * 0.495;
  controls.autoRotateSpeed = 0.5;
} else {
  stage.insertAdjacentHTML("beforeend", '<div class="nogl">مرورگر این دستگاه WebGL ندارد؛ متن همهٔ قدم‌ها در ستون کناری کامل است.</div>');
}
scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(-60, 140, 90); scene.add(sun);

const THEMED = new Map();   // cached materials, recoloured from CSS tokens on theme change
function cached(kind, token, opts = {}) {
  const key = kind + token + JSON.stringify(opts);
  if (THEMED.has(key)) return THEMED.get(key)[0];
  const M = kind === "basic" ? THREE.MeshBasicMaterial : kind === "line" ? THREE.LineBasicMaterial : THREE.MeshStandardMaterial;
  const m = new M(kind === "std" ? Object.assign({ roughness: .7 }, opts) : opts);
  const v = css(token); if (v) m.color.set(v);
  THEMED.set(key, [m, token]); return m;
}
const basic = (t, o) => cached("basic", t, o), linem = (t, o) => cached("line", t, o), stdm = (t, o) => cached("std", t, o);

const GROUPS = {};
function group(name, x, y = 0, z = 0) { const g = new THREE.Group(); g.position.set(x, y, z); g.visible = false; scene.add(g); GROUPS[name] = g; g.userData.name = name; return g; }

/* labels projected from 3D onto an HTML layer */
const LABELS = [], labelLayer = document.getElementById("labels");
function label(g, x, y, z, html, cls = "") {
  const el = document.createElement("div"); el.className = "lbl " + cls; el.innerHTML = ltrNums(html); el.style.opacity = 0;
  labelLayer.appendChild(el); const L = { g, p: new THREE.Vector3(x, y, z), el }; LABELS.push(L); return L;
}
function clearLabels(g) { for (let i = LABELS.length - 1; i >= 0; i--) if (LABELS[i].g === g) { LABELS[i].el.remove(); LABELS.splice(i, 1); } }
function clearGroup(g) { clearLabels(g); while (g.children.length) { const o = g.children.pop(); o.geometry && o.geometry.dispose(); } }

function line(g, pts, mat) { const geo = new THREE.BufferGeometry().setFromPoints(pts.map((p) => new THREE.Vector3(...p))); const l = new THREE.Line(geo, mat); g.add(l); return l; }
function rod(g, a, b, r, mat) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), d = B.clone().sub(A), len = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 10), mat);
  m.position.copy(A).add(d.multiplyScalar(0.5)); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize()); g.add(m); return m;
}
function ball(g, p, r, mat) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 14), mat); m.position.set(...p); g.add(m); return m; }
function box(g, p, s, mat) { const m = new THREE.Mesh(new THREE.BoxGeometry(...s), mat); m.position.set(...p); g.add(m); return m; }
function frame(g, cx, cz, half, y, mat) { // square outline on the ground
  const h = half; return line(g, [[cx - h, y, cz - h], [cx + h, y, cz - h], [cx + h, y, cz + h], [cx - h, y, cz + h], [cx - h, y, cz - h]], mat);
}

/* -------- 1. city: schematic NO₂ pattern as columns */
const gCity = group("city", 0, 0, 0);
const cityMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.9, 1, 0.9).translate(0, 0.5, 0), new THREE.MeshStandardMaterial({ roughness: .8 }), MASK.length);
(function () {
  const m = new THREE.Matrix4();
  MASK.forEach(([c, r], i) => { const t = (FIELD[r * W + c] - vmin) / (vmax - vmin); m.makeScale(1, 0.6 + 16 * t * t, 1); m.setPosition(c - 63, 0, r - 36); cityMesh.setMatrixAt(i, m); });
  gCity.add(cityMesh);
})();
function paintCity() {
  const lo = new THREE.Color(css("--scene-low")), mid = new THREE.Color(css("--scene-mid")), hot = new THREE.Color(css("--accent")), col = new THREE.Color();
  MASK.forEach(([c, r], i) => {
    const v = FIELD[r * W + c], t = (v - vmin) / (vmax - vmin);
    if (v >= HOT) col.copy(hot); else col.copy(lo).lerp(mid, Math.min(1, t * 1.25));
    cityMesh.setColorAt(i, col);
  });

function ring(name, x, items, tok, mark) {
  const g = group(name, x, 0, 0);
  items.forEach((t, i) => {
    const a = (i / items.length) * Math.PI * 2 - Math.PI / 2, R = 30, px = Math.cos(a) * R, pz = Math.sin(a) * R;
    const cube = box(g, [px, 2, pz], [4, 4, 4], stdm(tok)); cube.userData.spin = 0.4 + (i % 3) * 0.15;
    label(g, px, 7.2, pz, mark + " " + t, "");
  });
  return g;
}

/* ---------------------------------------------------------------- navigation and transitions */
const $ = (id) => document.getElementById(id);
const dots = $("dots");
let cur = -1;
STEPS.forEach((s, i) => {
  const b = document.createElement("button"); b.type = "button"; b.className = "dot" + (i && STEPS[i - 1].part !== s.part ? " sep" : "");
  b.textContent = fa(i + 1); b.title = s.title; b.setAttribute("aria-label", fa(i + 1) + ". " + s.title); b.onclick = () => go(i); dots.appendChild(b);
});
const flight = { t: 1, from: null, to: null, ft: null, tt: null };
function go(i) {
  i = Math.max(0, Math.min(STEPS.length - 1, i)); if (i === cur) return;
  const s = STEPS[i]; cur = i;
  $("eyebrow").textContent = s.part; $("title").textContent = s.title; $("body").innerHTML = ltrNums(s.html);
  $("controls").innerHTML = s.controls ? s.controls() : ""; $("caption").innerHTML = s.caption || "";
  $("partLabel").innerHTML = "<b>" + s.part + "</b> · قدم " + fa(i + 1) + " از " + fa(STEPS.length);
  $("counter").textContent = fa(i + 1) + " / " + fa(STEPS.length);
  $("prev").disabled = i === 0; $("next").disabled = i === STEPS.length - 1;
  [...dots.children].forEach((d, k) => { if (k === i) d.setAttribute("aria-current", "step"); else d.removeAttribute("aria-current"); });
  $("panel").scrollTop = 0;
  try { history.replaceState(null, "", "#" + s.id); } catch (e) {}
  // scene state
  for (const k in GROUPS) GROUPS[k].visible = s.groups.includes(k);
  if (s.groups.includes("tree")) { gPaper.visible = !!s.paper; gTree.userData.paperLbl.el.hidden = !s.paper; }
  if (s.reach) { reachState.L = s.reach.L; reachState.slx = s.reach.slx; drawReach(); }
  if (s.blur) setBlur(0);
  if (s.curve) { curveState.view = "3d"; drawCurve(); }
  if (s.blocks) paintBlocks();
  wireControls(s);
  if (controls) {
    controls.autoRotate = !!s.spin && !REDUCED;
    flyTo(s.cam[0], s.cam[1]);
  }
}
function flyTo(pos, target) {
  flight.from = camera.position.clone(); flight.ft = controls.target.clone();
  flight.to = new THREE.Vector3(...pos); flight.tt = new THREE.Vector3(...target);
  flight.t = REDUCED || flight.from.lengthSq() === 0 ? 1 : 0;
  if (flight.t === 1) { camera.position.copy(flight.to); controls.target.copy(flight.tt); }
}
function wireControls(s) {
  const seg = (id, fn) => { const el = $(id); if (!el) return; el.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; [...el.children].forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false")); fn(b.dataset.v); }; };
  seg("segL", (v) => { reachState.L = +v; drawReach(); });
  seg("segS", (v) => { reachState.slx = +v; drawReach(); });
  seg("segY", (v) => { curveState.year = +v; drawCurve(); });
  seg("segM", (v) => { curveState.metric = v === "pr" ? "pr" : "spearman"; drawCurve(); });
  seg("segV", (v) => { curveState.view = v; if (!controls) return; const g = GROUPS.curve.position.x; if (v === "front") flyTo([g + 44, 20, 150], [g + 44, 20, 0]); else flyTo(s.cam[0], s.cam[1]); });
  const rr = $("rbRange"); if (rr) { rr.oninput = () => setBlur(+rr.value); }
  const rp = $("rbPlay"); if (rp) rp.onclick = () => { let k = 0; rr.value = 0; setBlur(0); const t = setInterval(() => { k++; if (k >= RB.length || cur !== STEPS.findIndex((x) => x.id === "rq1")) { clearInterval(t); return; } rr.value = k; setBlur(k); }, REDUCED ? 50 : 650); };
  if (s.reach) drawReach();
}
$("prev").onclick = () => go(cur - 1); $("next").onclick = () => go(cur + 1);
addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("input")) return;
  if (e.key === " " && e.target.tagName === "BUTTON") return;
  if (["ArrowLeft", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  else if (["ArrowRight", "PageUp"].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  else if (e.key === "Home") go(0); else if (e.key === "End") go(STEPS.length - 1);
});
addEventListener("hashchange", () => { const k = STEPS.findIndex((s) => "#" + s.id === location.hash); if (k >= 0) go(k); });

/* ---------------------------------------------------------------- theme */
function applyTheme() {
  THEMED.forEach(([m, t]) => { const v = css(t); if (v) m.color.set(v); });
  const pc = new THREE.Color(); partState.forEach((p, i) => { pc.set(css(PART_COL[p.src])); parts.setColorAt(i, pc); }); parts.instanceColor.needsUpdate = true;
  paintCity(); if (GROUPS.blocks.visible) paintBlocks();
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* ---------------------------------------------------------------- render loop */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!renderer || !w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
const v3 = new THREE.Vector3(), mtx = new THREE.Matrix4(), ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
let last = performance.now(), blockClock = 0, gmClock = 0;
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (flight.t < 1) {
    flight.t = Math.min(1, flight.t + dt / 1.4); const e = ease(flight.t);
    camera.position.lerpVectors(flight.from, flight.to, e); controls.target.lerpVectors(flight.ft, flight.tt, e);
    const lift = Math.sin(Math.PI * e) * Math.min(120, flight.from.distanceTo(flight.to) * 0.25); camera.position.y += lift;
  }
  controls.update();
  const s = STEPS[cur];
  if (!REDUCED) {
    if (GROUPS.fusion.visible) {
      const t = now / 1000;
      const raw = [Math.sin(t * .7) + 1.2, Math.sin(t * .9 + 2) + 1.4, Math.sin(t * .5 + 4) * .6 + .6, Math.sin(t * 1.1 + 1) + 1.3].map(Math.exp);
      const z = raw.reduce((a, b) => a + b); gateW = raw.map((v) => v / z);
      partState.forEach((p, i) => {
        p.t += dt * 0.32; if (p.t > 1) p.t -= 1;
        const path = fusionPaths[p.src], seg = p.t * (path.length - 1), k = Math.min(path.length - 2, Math.floor(seg)), f = seg - k;
        const a = path[k], b = path[k + 1], after = p.t > 0.62;
        const pos = after ? [(p.t - .62) / .38 * 53, 0, 0] : [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
        if (after) pos[0] = pos[0] + 2;
        const sc = after ? 0.9 : 0.5 + gateW[p.src] * 2.6 * (p.t > 0.45 ? 1 : 0.6);
        mtx.makeScale(sc, sc, sc); mtx.setPosition(pos[0], pos[1], pos[2]); parts.setMatrixAt(i, mtx);
      });
      parts.instanceMatrix.needsUpdate = true;
      gate.rotation.y += dt * 0.8;
      gmClock += dt;
      if (gmClock > 0.15) { gmClock = 0; const gm = gateLbl.el.querySelector(".gm"); if (gm) gm.innerHTML = gateW.map((w, i) => `<i style="height:${Math.round(4 + w * 40)}px;background:var(${PART_COL[i]})"></i>`).join(""); }
    }
    if (GROUPS.blocks.visible) { blockClock += dt; if (blockClock > 1.8) { blockClock = 0; heldOut = (heldOut + 1) % blockIds.length; paintBlocks(); } }
    if (GROUPS.funnel.visible) gFunnel.userData.gem.rotation.y += dt;
    ["checks", "limits"].forEach((k) => { if (GROUPS[k].visible) GROUPS[k].children.forEach((c) => { if (c.userData.spin) c.rotation.y += dt * c.userData.spin; }); });
  }
  renderer.render(scene, camera);
  // labels
  const w = stage.clientWidth, h = stage.clientHeight, settled = flight.t >= 1;
  for (const L of LABELS) {
    const on = settled && L.g.visible && s.groups.includes(L.g.userData.name) && !(s.quiet || []).includes(L.g.userData.name) && !L.el.hidden;
    if (!on) { L.el.style.opacity = 0; continue; }
    v3.copy(L.p); L.g.localToWorld(v3); v3.project(camera);
    if (v3.z > 1 || v3.x < -1.2 || v3.x > 1.2 || v3.y < -1.2 || v3.y > 1.2) { L.el.style.opacity = 0; continue; }
    L.el.style.transform = `translate(${(v3.x * 0.5 + 0.5) * w}px, ${(-v3.y * 0.5 + 0.5) * h}px) translate(-50%,-50%)`;
    L.el.style.opacity = 1;
  }
  requestAnimationFrame(tick);
}

/* ---------------------------------------------------------------- start */
applyTheme(); drawReach(); drawCurve(); paintBlocks();
const start = Math.max(0, STEPS.findIndex((s) => "#" + s.id === location.hash));
go(start);
if (renderer) { resize(); camera.position.set(...STEPS[start].cam[0]); controls.target.set(...STEPS[start].cam[1]); flight.t = 1; requestAnimationFrame(tick); }
</script>
</body></html>
